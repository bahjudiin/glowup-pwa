<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GlowUp — Men's Transformation Library</title>
<meta name="description" content="Evidence-graded men's fat-loss, muscle, maintenance and glow-up library: 34 articles across 11 categories, 18 verified products with cost-per-serving maths, 26 USDA nutrition entries and 5 meal templates." />
<meta name="theme-color" content="#0e0c16" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
<meta name="color-scheme" content="light dark" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GlowUp" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />

<meta property="og:type" content="website" />
<meta property="og:title" content="GlowUp — Men's Transformation Library" />
<meta property="og:description" content="34 evidence-graded articles, 18 products with verified prices and cost-per-serving maths, 26 USDA foods and 5 meal templates. Installable, works offline." />
<meta property="og:image" content="icons/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="assets/app.css" />

<!-- glowup:standalone-flag -->
<script>
  /* Apply the persisted theme before first paint (no flash).
     The standalone build defaults to dark; the hosted build follows the OS. */
  (function () {
    try {
      var saved = localStorage.getItem("glowup:theme");
      var preferDark = window.GLOWUP_STANDALONE
        ? true
        : !window.matchMedia("(prefers-color-scheme: light)").matches;
      var dark = saved ? saved === "dark" : preferDark;
      document.documentElement.classList.toggle("dark", dark);
    } catch (e) {}
  })();
</script>
</head>

<body class="min-h-dvh">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded-md focus:bg-primary focus:px-3 focus:py-2 focus:text-primary-foreground">Skip to content</a>

<!-- ================= Header ================= -->
<header class="safe-top app-bar">
  <div class="app-bar-inner mx-auto max-w-screen-md">
    <div class="app-bar-brand">
      <span aria-hidden="true" class="app-bar-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="h-4 w-4">
          <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          <circle cx="12" cy="12" r="3.4"/>
        </svg>
      </span>
      <div class="min-w-0">
        <p class="app-bar-title truncate">GlowUp</p>
        <p class="app-bar-sub truncate" id="app-bar-sub">Today</p>
      </div>
    </div>

    <button id="search-open" class="icon-btn" aria-label="Search everything">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    </button>

    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
      </svg>
    </button>
  </div>
</header>

<main id="main" class="mx-auto max-w-screen-md px-4 pb-8 pt-3" tabindex="-1">
  <!-- views are rendered by app.js -->
  <section id="view-home" class="animate-fade-in" aria-label="Today"></section>
  <section id="view-plan" class="hidden animate-fade-in" aria-label="Blueprint"></section>
  <section id="view-library" class="hidden animate-fade-in" aria-label="Library"></section>
  <section id="view-guides" class="hidden animate-fade-in" aria-label="Deep-dive guides"></section>
  <section id="view-articles" class="hidden animate-fade-in" aria-label="Articles"></section>
  <section id="view-food" class="hidden animate-fade-in" aria-label="Nutrition"></section>
  <section id="view-products" class="hidden animate-fade-in" aria-label="Products"></section>
  <section id="view-meals" class="hidden animate-fade-in" aria-label="Meals"></section>

  <noscript>
    <div class="card mt-4">
      <div class="card-header"><h2 class="card-title">JavaScript is required</h2></div>
      <div class="card-content text-sm text-muted-foreground">
        GlowUp renders its library from a bundled data layer. Enable JavaScript, or read the source
        Markdown files in <code class="kbd">research/</code>.
      </div>
    </div>
  </noscript>
</main>

    <button class="tabbar-item" data-nav="learn">
      <span class="tabbar-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg></span>Learn</button>
    <button class="tabbar-item" data-nav="fuel">
      <span class="tabbar-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c4-3.2 7-6.4 7-10a7 7 0 1 0-14 0c0 3.6 3 6.8 7 10Z"/><path d="M12 6.5v5"/></svg></span>Fuel</button>

  </div>

<!-- ================= Search overlay ================= -->
<div id="search-overlay" class="fixed inset-0 z-40 hidden bg-background/95 backdrop-blur-xl" role="dialog" aria-modal="true" aria-label="Search GlowUp">
  <div class="safe-top mx-auto max-w-screen-md">
    <div class="flex items-center gap-2 border-b border-border px-4 py-2.5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 shrink-0 text-muted-foreground"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="search-input" type="search" class="no-ring h-11 w-full bg-transparent text-base outline-none placeholder:text-muted-foreground" placeholder="Search everything — creatine, fibre, sleep…" autocomplete="off" enterkeyhint="search" aria-describedby="search-status" />
      <button id="search-close" class="btn btn-ghost btn-sm">Close</button>
    </div>
    <div id="search-scope" class="chip-row px-4 pt-2"></div>
    <p id="search-status" class="px-4 pt-2 text-xs text-muted-foreground" role="status" aria-live="polite"></p>
    <div id="search-results" class="px-4 pb-24 pt-2"></div>
  </div>
</div>

<!-- ================= Detail sheet ================= -->
<div id="sheet-overlay" class="overlay hidden" hidden></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-handle"></div>
  <button id="sheet-close" class="btn btn-ghost btn-icon sheet-close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div id="sheet-body" class="px-4 pt-4"></div>
</div>

<!-- ================= Toast ================= -->
<div id="toast" class="pointer-events-none fixed inset-x-0 bottom-20 z-50 flex justify-center px-4" role="status" aria-live="polite"></div>

<!-- Offline banner -->
<div id="offline-banner" class="hidden fixed inset-x-0 top-0 z-40 bg-[hsl(var(--grade-mod))] px-4 py-1 text-center text-micro font-semibold text-black">
  Offline — showing the cached GlowUp library
</div>

</body>
</html>
