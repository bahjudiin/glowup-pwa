<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GlowUp Blueprint</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
    padding-bottom:90px;
  }
  .dark{--bg:#0a0a0f;--surface:#111118;--card:#161620;--text:#f8fafc;--muted:#94a3b8;--border:#27273a;--primary:#7c5cfc;--indigo:#6366f1;--rose:#f43f5e}
  .light{--bg:#f8fafc;--surface:#ffffff;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#6d4aff;--indigo:#4f46e5;--rose:#e11d48}

  /* Utilities */
  .container{max-width:680px;margin:0 auto;padding:0 16px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  .flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
  .gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
  .text-xs{font-size:0.75rem}.text-sm{font-size:0.875rem}.text-base{font-size:1rem}.text-lg{font-size:1.125rem}.text-xl{font-size:1.25rem}
  .font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
  .text-center{text-align:center}
  .mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mb-8{margin-bottom:32px}
  .mt-4{margin-top:16px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
  .px-4{padding-left:16px;padding-right:16px}.py-3{padding-top:12px;padding-bottom:12px}
  .pt-3{padding-top:12px}.pb-3{padding-bottom:12px}.p-4{padding:16px}.p-6{padding:24px}
  .rounded-xl{border-radius:1rem}.rounded-full{border-radius:9999px}
  .border{border:1px solid var(--border)}.border-b{border-bottom:1px solid var(--border)}
  .bg-surface{background:var(--surface)}.bg-card{background:var(--card)}.bg-bg{background:var(--bg)}
  .text-primary{color:var(--primary)}.text-muted{color:var(--muted)}
  .overflow-hidden{overflow:hidden}.overflow-x-auto{overflow-x:auto}

  /* Header / search */
  header{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 80%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .search-wrap{position:relative;width:100%;max-width:680px;margin:0 auto;padding:10px 16px 14px}
  #search{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 12px 10px 40px;border-radius:10px;font-size:0.95rem;outline:none}
  #search::placeholder{color:var(--muted)}
  #search:focus{border-color:var(--primary)}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
  .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;display:none}
  .clear-btn.visible{display:block}

  /* Category tabs - horizontal scroll */
  .tab-strip{position:sticky;top:44px;z-index:30;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:8px 16px}
  .tab-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
  .tab-scroll::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}
  .tab:hover{color:var(--text);border-color:var(--primary)}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px}
  .tab.active .dot{background:#fff}

  /* Sort tabs */
  .sort-wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px 8px}
  .sort-wrap::-webkit-scrollbar{display:none}
  .sort-pill{white-space:nowrap;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:0.8rem;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .2s}
  .sort-pill:hover{border-color:var(--primary);color:var(--text)}
  .sort-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* Filters sheet */
  .filter-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:10px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:16px}
  .filter-btn:hover{color:var(--primary);border-color:var(--primary)}
  .filter-btn .active-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);display:none}
  .filter-btn.has-active .active-dot{display:block}

  .sheet{position:fixed;inset:0;z-index:60;display:none}
  .sheet.open{display:flex;flex-direction:column}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
  .sheet-panel{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:24px 20px 34px;max-height:85vh;overflow-y:auto;box-shadow:0 -20px 40px -10px rgba(0,0,0,.4)}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .sheet-title{font-size:1.1rem;font-weight:700}
  .sheet-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1}
  .sheet-section{margin-bottom:20px}
  .sheet-label{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;display:block}
  .chip-group{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:0.85rem;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chip:hover{border-color:var(--primary);color:var(--text)}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
  .switch{position:relative;width:44px;height:24px;background:var(--border);border-radius:999px;cursor:pointer}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
  .switch.on{background:var(--primary)}
  .switch.on::after{transform:translateX(20px)}
  .sheet-actions{display:flex;gap:10px;margin-top:24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn-primary{background:var(--primary);color:#fff;padding:10px 20px;font-size:0.9rem}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 20px;font-size:0.9rem}
  .btn-outline:hover{background:var(--card)}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:1rem;overflow:hidden;transition:transform .2s,border-color .2s}
  .card:hover{border-color:var(--primary)/50;transform:translateY(-2px)}
  .card-header{padding:14px 16px;border-bottom:1px solid var(--border)}
  .card-title{font-size:1rem;font-weight:700;line-height:1.3}
  .card-desc{font-size:0.85rem;color:var(--muted);margin-top:4px}
  .card-body{padding:14px 16px}
  .card-footer{padding:12px 16px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--card) 90%,var(--bg))}

  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:0.7rem;font-weight:700;border:1px solid}
  .badge-high{border-color:#10b981;color:#10b981;background:rgba(16,185,129,.1)}
  .badge-mod{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.1)}
  .badge-low{border-color:#94a3b8;color:#94a3b8;background:rgba(148,163,184,.1)}
  .badge-verified{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.1)}
  .badge-link{border-color:#64748b;color:#64748b;background:rgba(100,116,139,.1)}
  .badge-essential{background:var(--primary);color:#fff;border-color:var(--primary)}
  .badge-highval{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .badge-optional{border-color:var(--border);color:var(--muted)}
  .badge-skip{border-color:var(--rose);color:var(--rose);background:rgba(244,63,94,.1)}

  .price-row{display:flex;align-items:baseline;gap:4px}
  .price-big{font-size:1.35rem;font-weight:800}
  .price-small{font-size:0.8rem;color:var(--muted)}
  .per-serving{font-size:0.75rem;color:var(--muted);margin-top:2px}

  .meta-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:color-mix(in srgb,var(--border) 60%,transparent);border:1px solid var(--border);border-radius:8px;font-size:0.72rem;color:var(--muted);margin:2px}
  .meta-chip span:first-child{color:var(--primary);font-weight:700}

  /* Food row */
  .food{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
  .food:last-child{border-bottom:none}
  .food-info{flex:1;min-width:0}
  .food-name{font-weight:700}
  .food-group{font-size:0.7rem;text-transform:uppercase;letter-spacing:.03em}
  .food-stats{display:flex;gap:14px;margin-top:6px;font-size:0.8rem;color:var(--muted)}
  .food-stats b{color:var(--text)}
  .food-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .food-cost{font-size:0.8rem;color:var(--muted);text-align:right}
  .food-notes{font-size:0.78rem;color:var(--muted);margin-top:4px}

  /* Meal card */
  .meal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
  .meal-type{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .meal-title{font-size:1.05rem;font-weight:700;padding:14px 16px}
  .meal-body{padding:0 16px 14px}
  .meal-meta{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .meal-notes{font-size:0.85rem;color:var(--muted);margin-bottom:8px}
  .ingredients{display:flex;flex-wrap:wrap;gap:6px}
  .ing{background:color-mix(in srgb,var(--border) 40%,transparent);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:0.75rem;color:var(--muted)}

  /* Sub-tabs (tier 3) */
  .subtab-strip{position:sticky;top:96px;z-index:29;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:7px 16px}
  .subtab-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .subtab-scroll::-webkit-scrollbar{display:none}
  .subtab{white-space:nowrap;background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:999px;font-size:0.78rem;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
  .subtab:hover{border-color:var(--primary);color:var(--text)}
  .subtab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .subtab .count{font-weight:700;opacity:.75;font-size:0.72rem}
  .subtab-desc{font-size:0.78rem;color:var(--muted);padding:0 16px 8px;margin-top:-2px}
  .subtab-strip.hidden{display:none}

  /* Article reader */
  .reader{position:fixed;inset:0;z-index:80;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .reader.open{display:block}
  .reader-head{position:sticky;top:0;z-index:2;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .reader-head .sheet-title{font-size:0.95rem}
  .reader-inner{max-width:680px;margin:0 auto;padding:20px 16px 72px}
  .reader-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .reader-title{font-size:1.5rem;font-weight:800;line-height:1.25;margin-bottom:8px}
  .reader-summary{font-size:0.95rem;color:var(--muted);margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .reader-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
  .md h1{font-size:1.3rem;font-weight:800;margin:24px 0 10px}
  .md h2{font-size:1.12rem;font-weight:800;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .md h3{font-size:1rem;font-weight:700;margin:20px 0 8px}
  .md p{margin-bottom:12px;font-size:0.95rem;line-height:1.7}
  .md ul,.md ol{margin:0 0 14px 20px}
  .md li{margin-bottom:6px;font-size:0.95rem;line-height:1.65}
  .md blockquote{margin:0 0 14px;padding:10px 14px;border-left:3px solid var(--primary);background:var(--card);border-radius:0 8px 8px 0;color:var(--muted);font-size:0.9rem;line-height:1.6}
  .md code{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:0.85em}
  .md hr{border:none;border-top:1px solid var(--border);margin:22px 0}
  .md strong{color:var(--text);font-weight:700}
  .md em{font-style:italic}

  /* Empty state */
  .empty{text-align:center;padding:48px 24px;opacity:.7}
  .empty-icon{font-size:2.5rem;margin-bottom:12px}
  .empty-title{font-weight:700;margin-bottom:6px}
  .empty-desc{color:var(--muted);font-size:0.9rem;max-width:360px;margin:0 auto}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 4px 16px;display:flex;justify-content:center;gap:0}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;color:var(--muted);text-decoration:none;font-size:0.7rem;font-weight:700;cursor:pointer;min-width:60px}
  .nav-item svg{width:20px;height:20px}
  .nav-item.active{color:var(--primary)}
  .theme-toggle{position:absolute;right:12px;top:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
  .theme-toggle:hover{color:var(--primary)}

  .section-label{font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:24px 0 12px;display:block}
  .divider{height:1px;background:var(--border);margin:20px 0}

  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>

<!-- Theme toggle -->
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>

<!-- Header + search -->
<header>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" id="search" placeholder="Search articles, products, foods, meals…" autocomplete="off">
    <button class="clear-btn" id="clearSearch" aria-label="Clear">×</button>
  </div>
</header>

<div class="container">
  <!-- Category tabs -->
  <div class="tab-strip">
    <div class="tab-scroll" id="tabScroll"></div>
    <div style="height:4px"></div>
  </div>

  <!-- Sub-tabs (tier 3, rendered per category) -->
  <div class="subtab-strip hidden" id="subTabStrip">
    <div class="subtab-scroll" id="subTabScroll" role="tablist" aria-label="Category sections"></div>
  </div>

  <!-- Search bar (mobile fallback) -->
  <button class="filter-btn" id="filterBtn" aria-label="Filters">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <span>Filters</span>
    <span class="active-dot" id="filterDot"></span>
  </button>

  <!-- Sort tabs -->
  <div class="sort-wrap" id="sortWrap"></div>

  <!-- Content -->
  <div id="content"></div>
</div>

<!-- Filters sheet -->
<div class="sheet" id="filterSheet">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet-header">
      <span class="sheet-title">Filters</span>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div class="sheet-section">
      <span class="sheet-label">Category</span>
      <div class="chip-group" id="catChips"></div>
    </div>
    <div class="sheet-section">
      <span class="sheet-label">Evidence grade</span>
      <div class="chip-group" id="evChips"></div>
    </div>
    <div class="sheet-section">
      <span class="sheet-label">Cost tier</span>
      <div class="chip-group" id="costChips"></div>
    </div>
    <div class="toggle-row">
      <span>Verified prices only</span>
      <div class="switch" id="verifiedSwitch" role="switch" aria-checked="false"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-outline" id="resetFilters">Reset</button>
      <button class="btn btn-primary" id="applyFilters">Apply</button>
    </div>
  </div>
</div>

<!-- Article reader -->
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="Article">
  <div class="reader-head">
    <span class="sheet-title" id="readerHead">Article</span>
    <button class="sheet-close" id="readerClose" aria-label="Close article">✕</button>
  </div>
  <div class="reader-inner" id="readerBody"></div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <a class="nav-item active" href="#" data-section="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Home</span></a>
  <a class="nav-item" href="#" data-section="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L21 1"/></svg><span>Products</span></a>
  <a class="nav-item" href="#" data-section="foods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 13h2M7 13h2M12 13h2M17 13h2M2 17h2M7 17h2M12 17h2M17 17h2M2 21h2M7 21h2M12 21h2M17 21h2M4 7v10M9 7v10M14 7v10M19 7v10"/></svg><span>Foods</span></a>
  <a class="nav-item" href="#" data-section="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="7" x2="22" y2="7"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="17" x2="22" y2="17"/><line x1="2" y1="22" x2="22" y2="22"/></svg><span>Meals</span></a>
</nav>

<script>
// ============ DATA ASSEMBLED FROM MD FILES ============
// Every category declares tier-3 subTabs. Every article belongs to exactly one
// sub-tab of its category, so the reader is always navigable.
// `ids` = article ids inside the sub-tab.
const CATEGORIES = [
  {id:'fat-loss',title:'Fat Loss',subtitle:'Deficits, rates, plateaus, fasting',icon:'🔥',files:['02','04','20'],color:'bg-orange-500/20 text-orange-400',
   subTabs:[
     {id:'deficit',title:'Deficit & Rate',desc:'Energy deficit, rate of loss, plateaus',ids:['fast-fat-loss','aggressive-transformation']},
     {id:'fasting',title:'Fasting',desc:'16:8 vs 14:10, autophagy myths',ids:['intermittent-fasting']},
   ]},
  {id:'muscle-training',title:'Muscle & Training',subtitle:'Protein, resistance training & recomposition',icon:'💪',files:['03','10','06'],color:'bg-emerald-500/20 text-emerald-400',
   subTabs:[

  {id:'mens-grooming',title:"Men's Grooming & Appearance",summary:'Facial fat, teeth, hair, posture, clothing, fragrance.',categoryId:'skincare-grooming',subTabId:'grooming',fileId:'15',evidenceGrade:'Moderate',costTier:'Low',readTime:'8 min',tags:['grooming','hair']},
  {id:'hair-loss-scalp',title:'Hair Loss & Scalp',summary:'Androgenetic alopecia, finasteride, minoxidil, safety.',categoryId:'skincare-grooming',subTabId:'hair',fileId:'24',evidenceGrade:'Moderate-High',costTier:'Low',readTime:'8 min',tags:['hair-loss','finasteride']},
  {id:'sleep-recovery',title:'Sleep & Recovery',summary:'Sleep evidence, CBT-I, apnea screening, recovery protocol.',categoryId:'sleep-recovery',subTabId:'sleep-protocol',fileId:'11',evidenceGrade:'Moderate-High',costTier:'Free',readTime:'9 min',tags:['sleep','apnea'],
   content:`## Why sleep comes first

Sleep is upstream of almost everything else. Short sleep raises hunger, lowers
testosterone, blunts training adaptation and increases stress reactivity. Fixing sleep
first makes every other intervention cheaper.

## The baseline

- **7–9 hours** every night for eight weeks before you judge anything.
- **Same wake time** every day, weekends included. Wake time anchors the circadian clock.
- **Morning daylight** — 10–20 minutes outdoors within an hour of waking.
- **Cool room** (about 18–19 C) and blackout if you can manage it.

## Caffeine and alcohol

- Caffeine has a half-life of roughly 5–6 hours. A 14:00 coffee is still half-active at
  20:00. Cut off 8–10 hours before bed.
- Alcohol helps you fall asleep but fragments the second half of the night and suppresses
  testosterone for hours afterwards.

## Screen for sleep apnoea

Snoring, witnessed apnoeas, morning headaches, dry mouth and unrefreshing sleep are the
classic signs. Apnoea causes intermittent hypoxia, which suppresses testosterone and
contributes to hypertension and weight gain. A home sleep-apnoea test is worth it if any
of those apply.

## CBT-I for insomnia

If you cannot sleep, cognitive behavioural therapy for insomnia beats sleeping pills over
the long term and has no dependence risk.

- Get out of bed if you are awake more than 20 minutes.
- No naps after 15:00.
- Fixed wake time, even after a bad night. Never sleep in to compensate.
- If you cannot sleep, get up, do something dull in dim light, and return when sleepy.`},
  {id:'sleep-debt-recovery',title:'Sleep Debt & Recovery',summary:'How to pay back a sleep deficit without wrecking your training week.',categoryId:'sleep-recovery',subTabId:'recovery',fileId:'11',evidenceGrade:'Moderate',costTier:'Free',readTime:'7 min',tags:['sleep','recovery','training-load'],
   content:`## What sleep debt actually does

A week of five-hour nights is not a debt you repay on the weekend. It carries forward for
days: reaction time, insulin sensitivity, testosterone, mood and training adaptation all
stay impaired for several nights after you start sleeping enough again.

## Paying it back

- **Climb, do not crash.** Add 20–30 minutes per night rather than doubling the total on one
  night.
- **Anchor the wake time.** This matters more than the bedtime.
- **Expect 5–7 nights** of consistent adequate sleep to feel meaningfully different, and
  2–3 weeks to fully recover metabolic markers.
- **Resume hard training last.** Rebuild intensity before volume.

## Naps

- **20 minutes, before 15:00.** Long enough to clear sleep pressure, short enough not to
  impair night sleep.
- Never replace a night of sleep with a nap.
- A 10-minute nap is a legitimate performance tool before a hard session or a long drive.

## Alcohol and training load

- Alcohol shortens sleep onset but fragments the night and suppresses REM.
- If sleep drops below six hours for two nights in a row, cut training volume by half —
  not intensity. More training on top of a sleep deficit is how injuries happen.

> If your resting heart rate is up, motivation is gone and your sleep is poor, you are not
> lazy. You are under-recovered. Deload, sleep, and come back.`},
  {id:'appetite-satiety',title:'Appetite & Satiety',summary:'Protein, fibre, volume, sleep — reduce intake 300–700 kcal/day.',categoryId:'sleep-recovery',subTabId:'appetite',fileId:'05',evidenceGrade:'Moderate-High',costTier:'Free',readTime:'8 min',tags:['appetite','satiety'],
   content:`## The four levers

1. **Protein** — the strongest appetite signal. Keep total protein at 1.6–2.4 g/kg of body
   weight.
2. **Fibre** — 25–38 g a day from psyllium, legumes and vegetables.
3. **Volume** — low-energy-density foods. Cabbage at 25 kcal/100 g versus almonds at 580
   kcal/100 g means you can eat an enormous amount of the first for almost nothing.
4. **Sleep** — one or two short nights measurably increase ghrelin (hunger) and decrease
   leptin (satiety).

## What a 300–700 kcal reduction looks like

- Add one 30 g protein serving and one extra serving of vegetables at lunch and dinner.
- Swap refined grains for legumes in two meals.
- Replace liquid calories with water or unsweetened drinks.
- Cut alcohol to weekends only.
- Eat the same food but add a large low-calorie salad first.

## Watch the weekend

A week at 2200 kcal followed by a weekend at 4000 kcal does not average out in your
favour — appetite regulation, insulin sensitivity and adherence all suffer for days after.
Keep the weekend within roughly 15% of the weekday average.

> Extreme hunger is a signal that something is wrong: too little protein, too little sleep,
> too little food volume, or too aggressive a deficit. Fix the input before you fight the
> output.`},

  {id:'big-d-sexual-function',title:'Sexual Function & Erectile Function',summary:'Stress is the biggest driver of erectile dysfunction — and the axis that recovers it runs through sleep, nutrition and stimulus control.',categoryId:'mens-vitality',subTabId:'sexual-function',fileId:'27',evidenceGrade:'Moderate',costTier:'Low',readTime:'9 min',tags:['big-d','erectile','blood-flow','stress'],
   content:`## Stress: the root cause

Stress is the number one reported cause of erectile dysfunction and premature ejaculation.
Chronic stress drives catabolic processes that deplete nutrients, blunt testosterone and
narrow the focus sexual function depends on.

**Hormones that support sexual function**

- Testosterone, DHT, thyroid hormone, progesterone, DHEA
- Dopamine, acetylcholine, nitric oxide

**Hormones that work against it**

- Cortisol, prolactin, excess estrogen, excess serotonin, oxidative stress

## Erectile function: the facts

- Around **30% of men under 30** and 25% of men under 40 report erectile dysfunction. This
  is not only an older-man issue.
- **Avoid:** beer, cigarettes, fast food (PUFAs), prolonged sitting, tight underwear.
- Sleep is the first line of defence — melatonin is a powerful antioxidant that protects
  nerves.
- Hydrogen sulfide (H2S) from sulfur-rich foods such as garlic and onion acts as an
  alternative vasodilator to nitric oxide.

## Herbal and food support

- **Ashwagandha** — reduces stress around 20%, supports blood flow and testosterone.
- **Tribulus terrestris** — lowers prolactin and estrogen, raises dopamine. Minimum 120 mg
  protodioscin per day.
- **Mucuna pruriens** — L-DOPA precursor; raises dopamine and testosterone, lowers serotonin.
- **Butea superba** — raises DHT, which matters for libido drive.
- **Tongkat ali** — aromatase inhibitor and PDE-5 inhibitor; improves blood flow.
- **Horny goat weed (epimedium)** — natural PDE-5 inhibitor.
- **Maca** — improves oxygenation and endurance; 2–4 g daily over 12 weeks.
- **Ginkgo biloba** — antioxidant, improves circulation, helps counter excess serotonin.

## Vasodilatory foods

- Cacao, beets, pomegranate and watermelon boost nitric oxide.
- Garlic combined with vitamin C increases nitric oxide production substantially.
- Ginger reduces serotonin via the 5-HT3 receptor.

## What to do first

1. Sleep 7–9 hours, consistently.
2. Train three to five times a week with one weekly zone-2 session.
3. Fix the diet: protein, vegetables, and cut alcohol to near zero for two weeks.
4. Only then evaluate supplements.

> Persistent erectile dysfunction is a cardiovascular risk marker. Get blood pressure,
> fasting glucose and lipids checked before treating it as a purely sexual problem.`},
  {id:'big-d-pe',title:'Premature Ejaculation',summary:'Usually low dopamine plus elevated serotonin or adrenaline — a nervous-system control problem before it is a supplement problem.',categoryId:'mens-vitality',subTabId:'premature-ejaculation',fileId:'27',evidenceGrade:'Moderate',costTier:'Free',readTime:'6 min',tags:['big-d','pe','dopamine','serotonin'],
   content:`## The mechanism

Premature ejaculation is caused by low dopamine combined with elevated serotonin or
adrenaline. That combination narrows the window between arousal and climax.

**How to shift it**

- **Raise acetylcholine** — egg yolks, liver and royal jelly feed acetylcholine synthesis,
  which supports dopamine.
- **Support dopamine and calm** — taurine supports dopamine and GABA together, which is the
  balance you want: present, not flat.
- **Lower excess serotonin** — magnesium regulates serotonin and calms the nervous system;
  ginkgo helps counter excess serotonin.
- **Cut adrenaline spikes** — caffeine, alcohol and sleep debt all raise sympathetic tone.

## Practical protocol

1. **Sleep first.** Under-sleeping raises serotonin and lowers dopamine; it alone reproduces
   the pattern.
2. **Train the exhale.** Slow nasal breathing with a long exhale before and during sex
   lowers sympathetic activation.
3. **Start-stop and squeeze technique**, 3 sets of 10, three times a week for four weeks.
4. **Reduce alcohol.** It worsens early ejaculation and erections simultaneously.
5. **Consider a topical anaesthetic** (lidocaine/prilocaine) if behavioural work is not
   enough. It is the highest-evidence intervention for premature ejaculation.

> See a clinician if premature ejaculation is new, sudden, or comes with pain, blood in the
> semen, or testicular changes.`},
  {id:'big-d-fertility',title:'Fertility & Sperm Health',summary:'Sperm production runs on LH and FSH and is highly sensitive to endocrine disruptors, heat and oxidative stress.',categoryId:'mens-vitality',subTabId:'fertility',fileId:'27',evidenceGrade:'Moderate',costTier:'Low',readTime:'8 min',tags:['big-d','fertility','sperm','shilajit'],
   content:`## What controls sperm production

- **LH** (luteinising hormone) signals the testes to produce testosterone.
- **FSH** (follicle-stimulating hormone) signals Sertoli cells to drive sperm production.
- **Xenoestrogens** — plastics, phthalates and other endocrine disruptors — reduce sperm
  counts. This is one of the highest-leverage changes and it is free.

## Key enhancers

- **Ginger** — associated with roughly +16% sperm count and improved LH/FSH/testosterone.
- **Vitamin E** — the fertility vitamin; protects sperm membranes from PUFA damage.
- **Vitamin K2** — supports testosterone and Leydig cell function.
- **Shilajit** — associated with roughly +37.6% sperm quality, +61.4% sperm count and +23.5%
  testosterone in trial data.
- **Cistanche** — restores kisspeptin signalling, which is essential for reproduction.
- **Royal jelly** — associated with roughly +20% testosterone over three months.
- **Maca** — increases sperm count and semen quality.
- **Raw onion and garlic** — improve sperm number and motility.

## Baseline for both partners

1. Both partners get a semen analysis and hormone panel before anything else.
2. Check for a varicocele — common, correctable and frequently missed.
3. Two to three months of targeted lifestyle work, then re-test. Sperm cycles run about 74
   days, so what you change today shows up in a quarter, not tomorrow.
4. Keep the testes cool: avoid prolonged hot baths, laptops on the lap and tight synthetic
   underwear.

> Sperm quality falls sharply after 35 and more steeply after 40. If you want children, do
> not leave this to later.`},
  {id:'big-d-attraction',title:'Attraction & Androgen Signs',summary:'Androsterone in sweat, a broad jaw, lower vocal pitch and vascularity are the observable correlates of higher testosterone and DHT.',categoryId:'mens-vitality',subTabId:'attraction',fileId:'27',evidenceGrade:'Low',costTier:'Free',readTime:'6 min',tags:['big-d','attraction','pheromones','androgens'],
   content:`## Androgen signs

- **Hair** — healthy hair is a virility signal driven by testosterone and DHT.
- **Face** — a broad jawline and high cheekbones read as higher testosterone.
- **Voice** — a lower pitch reflects greater DHT exposure during puberty.
- **Body** — broad shoulders, a lean waist and visible vascularity.
- **Grip** — forearm strength correlates with testosterone.

## Pheromones

- Androsterones in sweat increase attraction via a musky odour.
- Exercise-induced sweating raises pheromone levels.
- An animal-based diet raises musky body odour.
- Avoid over-washing with harsh chemicals — it destroys the skin microbiome that produces
  the scent signal.

## Practical levers

1. **Lose body fat.** Visceral fat is the strongest single driver of low testosterone. At
   15% body fat and below, testosterone typically normalises for most men.
2. **Train heavy and compound.** Squat, hinge, press, pull. Heavy compound work is the
   strongest non-supplement testosterone lever there is.
3. **Fix sleep.** Seven to nine hours. A single night of five-hour sleep measurably
   suppresses testosterone the next day.
4. **Cut the obvious.** Alcohol, cigarettes and chronic stress suppress testosterone and DHT
   simultaneously.
5. **Presentation compounds the biology.** Good grooming, posture, a fitted haircut and
   clean skin change how the same testosterone is read.

> These signals are real but modest. Behaviour, status and hygiene move perceived attraction
> further than any single hormone.`},
  {id:'big-d-testosterone',title:'Fixing Low Testosterone',summary:'Low testosterone is usually a supply-chain problem: sleep, training, body fat, nutrients and endocrine disruptors, checked in that order.',categoryId:'mens-vitality',subTabId:'testosterone',fileId:'27',evidenceGrade:'Moderate',costTier:'Low',readTime:'8 min',tags:['big-d','testosterone','deficiencies','emf'],
   content:`## Boost LH and dopamine

Ginger, taurine, cistanche, mucuna and manganese support the GnRH to LH to FSH to
testosterone cascade. Adequate sleep is the largest single input to that cascade.

## Fix the deficiencies

Testosterone is a nutrient-dependent hormone. Correct these first and the hormone usually
responds without drugs.

- **Vitamins A, K2, E, D and the B complex** — required for hormone synthesis.
- **Zinc, selenium and iodine** — support thyroid function and testosterone.
- **Shilajit** — mitochondrial and hormonal support.
- **Boron and magnesium** — improve free testosterone and reduce estrogen.

## Manage serotonin

Excess serotonin suppresses libido and drive.

- Magnesium regulates serotonin and calms the nervous system.
- Ginkgo counters serotonin excess and enhances blood flow.
- Ginger reduces gut serotonin via the 5-HT3 receptor.
- L-theanine reduces anxiety and boosts antioxidant status.

## Avoid the disruptors

- **Xenoestrogens** — avoid plastics, phthalates and endocrine disruptors.

const $ = (sel)=>document.querySelector(sel);

// Escape user/content text before it goes into innerHTML.
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Minimal markdown -> HTML. Escapes first, so content can never inject markup.
function mdToHtml(src){
  if(!src) return '';
  const lines = String(src).replace(/\r\n/g,'\n').split('\n');
  const out=[];
  let list=null;        // 'ul' | 'ol'
  let para=[];
  const flushPara=()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushList=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  const inline=(t)=>esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');

  for(const raw of lines){
    const line=raw.trimEnd();
    if(!line.trim()){ flushPara(); flushList(); continue; }
    if(/^---+$/.test(line.trim())){ flushPara(); flushList(); out.push('<hr/>'); continue; }
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){
      flushPara(); flushList();
      const lvl=m[1].length;
      out.push('<h'+lvl+'>'+inline(m[2])+'</h'+lvl+'>');
      continue;
    }
    if((m=line.match(/^>\s?(.*)$/))){
      flushPara(); flushList();
      out.push('<blockquote>'+inline(m[1])+'</blockquote>');
      continue;
    }
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){
      flushPara();
      if(list!=='ul'){ flushList(); out.push('<ul>'); list='ul'; }
      out.push('<li>'+inline(m[1])+'</li>');
      continue;
    }
    if((m=line.match(/^\s*\d+\.\s+(.*)$/))){
      flushPara();
      if(list!=='ol'){ flushList(); out.push('<ol>'); list='ol'; }
      out.push('<li>'+inline(m[1])+'</li>');
      continue;
    }
    para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join('\n');
}

// ── Tier 2: category tabs ────────────────────────────────────
function renderCategoryTabs(){
  const wrap=$('#tabScroll');
  wrap.innerHTML='';
  const all=document.createElement('div');
  all.className='tab'+(state.category==='all'?' active':'');
  all.setAttribute('role','tab');
  all.setAttribute('aria-selected', state.category==='all'?'true':'false');
  all.innerHTML='<span class="dot"></span>All';
  all.onclick=()=>setState({category:'all',subTab:'all'});
  wrap.appendChild(all);
  CATEGORIES.forEach(c=>{
    const el=document.createElement('div');
    el.className='tab'+(state.category===c.id?' active':'');
    el.setAttribute('role','tab');
    el.setAttribute('aria-selected', state.category===c.id?'true':'false');
    el.innerHTML='<span class="dot"></span>'+esc(c.title);
    el.onclick=()=>setState({category:c.id,subTab:'all'});
    wrap.appendChild(el);
  });
}

// ── Tier 3: sub-tabs ─────────────────────────────────────────
function renderSubTabs(){
  const strip=$('#subTabStrip');
  const scroll=$('#subTabScroll');
  const cat=catById(state.category);
  if(!cat||!cat.subTabs||!cat.subTabs.length){ strip.classList.add('hidden'); scroll.innerHTML=''; return; }
  strip.classList.remove('hidden');

  const tabs=[{id:'all',title:'All',desc:'Everything in '+cat.title,ids:null}]
    .concat(cat.subTabs.map(s=>({id:s.id,title:s.title,desc:s.desc,ids:s.ids})));

  scroll.innerHTML=tabs.map(t=>{
    const n=(t.ids? t.ids.length : ARTICLES.filter(a=>a.categoryId===cat.id).length);
    const active=state.subTab===t.id;
    return `<button class="subtab${active?' active':''}" role="tab" data-subtab="${esc(t.id)}" aria-selected="${active?'true':'false'}">${esc(t.title)}<span class="count">${n}</span></button>`;
  }).join('');

  scroll.querySelectorAll('.subtab').forEach(b=>{
    b.onclick=()=>setState({subTab:b.dataset.subtab});
    b.onkeydown=(e)=>{
      if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
      e.preventDefault();
      const btns=Array.from(scroll.querySelectorAll('.subtab'));
      const i=btns.indexOf(b);
      const next=e.key==='ArrowRight'? (i+1)%btns.length : (i-1+btns.length)%btns.length;
      btns[next].focus(); btns[next].click();
    };
  });

  const active=tabs.find(t=>t.id===state.subTab)||tabs[0];
  let desc=strip.querySelector('.subtab-desc');
  if(!desc){ desc=document.createElement('div'); desc.className='subtab-desc'; strip.appendChild(desc); }
  desc.textContent=active.desc||'';
}

function setState(partial){
  const prevCategory=state.category;
  Object.assign(state,partial);
  // switching category invalidates the sub-tab (the two hierarchies differ)
  if(partial.category && partial.category!==prevCategory) state.subTab='all';
  persistState();
  renderCategoryTabs();
  renderSubTabs();
  renderSortTabs();
  renderFilterChips();
  renderContent();
  $$('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.section===state.section));
}

function activeSubTab(){
  const cat=catById(state.category);
  if(!cat||!cat.subTabs||state.subTab==='all') return null;
  return cat.subTabs.find(s=>s.id===state.subTab)||null;
}

function filterItems(items){
  const sub=activeSubTab();
  return items.filter(it=>{
    if(sub){
      const ids=sub.ids||[];
      if(!ids.includes(it.id)) return false;
    }
    if(state.q){
      const s=[it.title,it.summary,it.name,it.group,it.purpose,it.subtitle,(it.tags||[]).join(' ')].filter(Boolean).join(' ').toLowerCase();
      if(!s.includes(state.q.toLowerCase())) return false;
    }
    if(state.evidence && it.evidenceGrade!==state.evidence) return false;
    if(state.cost && it.costTier!==state.cost) return false;
    if(state.verified && it.priceVerified===false) return false;
    return true;
  });
}

function sortItems(items){
  const s=[...items];
  switch(state.sort){
    case 'evidence': s.sort((a,b)=>{const o={High:5,'Moderate-High':4,Moderate:3,Low:2,'Very low':1,Insufficient:0};return (o[b.evidenceGrade]||0)-(o[a.evidenceGrade]||0);});break;
    case 'cost': s.sort((a,b)=>{const o={Free:0,'Very low':1,Low:2,Moderate:3,High:4,'Very high':5};return (o[a.costTier]||0)-(o[b.costTier]||0);});break;
    case 'name': s.sort((a,b)=>(a.title||a.name||'').localeCompare(b.title||b.name||''));break;
    case 'longest': s.sort((a,b)=>parseInt(b.readTime||'0',10)-parseInt(a.readTime||'0',10));break;
  }
  return s;
}

// ── Cards ────────────────────────────────────────────────────
function catCard(c){
  return `<button class="card" style="text-decoration:none;color:inherit;text-align:left;width:100%;cursor:pointer" onclick="setState({category:'${esc(c.id)}',subTab:'all'})"><div class="card-body"><div class="row"><div><div class="card-title">${esc(c.title)}</div><div class="card-desc">${esc(c.subtitle)}</div><div style="font-size:0.72rem;color:var(--muted);margin-top:6px">${c.subTabs.length} section${c.subTabs.length===1?'':'s'} · ${c.files.length} file${c.files.length===1?'':'s'}</div></div><div style="font-size:1.5rem">${c.icon}</div></div></div></button>`;
}

function articleCard(a){
  return `<button class="card" style="text-decoration:none;color:inherit;text-align:left;width:100%;cursor:pointer" onclick="openArticle('${esc(a.id)}')"><div class="card-body"><div class="row" style="justify-content:flex-start;gap:10px;flex-wrap:wrap">${badgeFor(a.evidenceGrade)}<span class="badge" style="border-color:var(--border);color:var(--muted);font-size:0.65rem">${esc(a.readTime)}</span></div><div class="card-title mt-3" style="display:block">${esc(a.title)}</div><div class="card-desc mt-2">${esc(a.summary)}</div><div class="mt-3" style="font-size:0.75rem;color:var(--muted);display:flex;gap:6px;align-items:center"><span>File ${esc(a.fileId)}</span></div></div></button>`;
}

function productCard(p){
  const priceText=p.price!==null?`$${p.price.toFixed(2)}`:'Price varies';
  return `<a href="${esc(p.url)}" target="_blank" rel="noopener" class="card" style="text-decoration:none;color:inherit"><div class="card-body"><div class="row" style="flex-wrap:wrap;gap:8px"><span class="badge ${p.priceVerified?'badge-verified':'badge-link'}">${p.priceVerified?'✅ Verified':'Search link'}</span>${essentialBadge(p)}</div><div class="card-title mt-2">${esc(p.name)}</div><div class="card-desc mt-1">${esc(p.brand)} · ${esc(p.category)}</div><div class="price-row mt-2"><span class="price-big">${priceText}</span><span class="price-small">${esc(p.currency)}</span>${p.perServing?'<div class="per-serving">· '+esc(p.perServing)+'</div>':''}</div><div class="mt-2" style="font-size:0.78rem;color:var(--muted)">${esc(p.purpose)}</div></div></a>`;
}

// ── Article reader ───────────────────────────────────────────
function openArticle(id){
  const a=ARTICLES.find(x=>x.id===id);
  if(!a) return;
  const cat=catById(a.categoryId);
  const sub=cat&&cat.subTabs?cat.subTabs.find(s=>s.id===a.subTabId):null;
  $('#readerHead').textContent=cat?cat.title:'Article';
  $('#readerBody').innerHTML=`
    <div class="reader-meta">${badgeFor(a.evidenceGrade)}<span class="badge" style="border-color:var(--border);color:var(--muted)">${esc(a.costTier)}</span><span class="badge" style="border-color:var(--border);color:var(--muted)">${esc(a.readTime)}</span></div>
    <h1 class="reader-title">${esc(a.title)}</h1>
    <p class="reader-summary">${esc(a.summary)}</p>
    ${sub?`<div class="sheet-label">Section</div><div style="margin-bottom:14px"><span class="badge badge-high">${esc(sub.title)}</span></div>`:''}
    <div class="md">${a.content?mdToHtml(a.content):'<p style="color:var(--muted)">Full text for this section is in the research library file ' + esc(a.fileId) + '.</p>'}</div>
    ${a.tags&&a.tags.length?`<div class="reader-tags">${a.tags.map(t=>`<span class="badge" style="border-color:var(--border);color:var(--muted)">${esc(t)}</span>`).join('')}</div>`:''}
    <div style="margin-top:24px"><a class="btn btn-primary" href="#cat-${esc(a.categoryId)}" onclick="closeReader();setState({category:'${esc(a.categoryId)}',subTab:'${esc(a.subTabId||'all')}')};return false">Open ${esc(cat?cat.title:'category')}</a></div>`;
  $('#reader').classList.add('open');
  document.body.style.overflow='hidden';
  $('#reader').scrollTop=0;
  $('#readerClose').focus();
}
function closeReader(){
  $('#reader').classList.remove('open');
  if(!$('#filterSheet').classList.contains('open')) document.body.style.overflow='';
}

// ── Search results ───────────────────────────────────────────
function renderSearch(){
  const q=state.q.trim().toLowerCase();
  const match=(f)=>{
    if(!q) return true;
    const s=[f.title,f.summary,f.name,f.brand,f.group,f.purpose,f.subtitle,f.category,(f.tags||[]).join(' '),(f.ingredients||[]).join(' '),f.notes,f.use,f.purpose].filter(Boolean).join(' ').toLowerCase();
    return s.includes(q);
  };
  const arts=sortItems(ARTICLES.filter(match));
  const prods=sortItems(PRODUCTS.filter(match));
  const foods=FOODS.filter(match);
  const meals=MEALS.filter(match);
  const cats=CATEGORIES.filter(c=>[c.title,c.subtitle].join(' ').toLowerCase().includes(q));
  const total=arts.length+prods.length+foods.length+meals.length;
  if(!total&&!cats.length){
    return `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-desc">Nothing matches "${esc(state.q)}". Try a different word, or browse a category from the tabs.</div></div>`;
  }
  let html=`<div class="card mb-4"><div class="card-body" style="padding:16px"><div class="card-title">${total} result${total===1?'':'s'} for "${esc(state.q)}"</div><div class="card-desc">Across articles, products, foods and meals.</div></div></div>`;
  if(cats.length){
    html+=`<section class="mb-6"><span class="section-label">Categories</span><div style="display:grid;gap:8px">${cats.map(c=>catCard(c)).join('')}</div></section>`;
  }
  if(arts.length){
    html+=`<section class="mb-6"><span class="section-label">Articles (${arts.length})</span><div style="display:grid;gap:10px">${arts.map(a=>articleCard(a)).join('')}</div></section>`;
  }
  if(prods.length){
    html+=`<section class="mb-6"><span class="section-label">Products (${prods.length})</span><div style="display:grid;gap:10px">${prods.map(p=>productCard(p)).join('')}</div></section>`;
  }
  if(foods.length){
    html+=`<section class="mb-6"><span class="section-label">Foods (${foods.length})</span><div>${foods.map(f=>`<div class="food"><div class="food-info"><div class="food-name">${esc(f.name)}</div><div class="food-group">${esc(f.group)}</div></div><div class="food-side"><div class="food-cost">${esc(f.kcal)} kcal</div></div></div>`).join('')}</div></section>`;
  }
  if(meals.length){
    html+=`<section class="mb-6"><span class="section-label">Meals (${meals.length})</span><div style="display:grid;gap:10px">${meals.map(m=>`<div class="card"><div class="card-body"><div class="card-title">${esc(m.title)}</div><div class="card-desc">${esc(m.type)} · ${esc(m.protein)} protein · ${esc(m.fibre)} fibre</div></div></div>`).join('')}</div></section>`;
  }
  return html;
}
// ── Home ─────────────────────────────────────────────────────
function renderHome(){
  const all=sortItems(filterItems(ARTICLES));
  const featured=all.filter(a=>a.fileId==='00'||a.fileId==='02'||a.fileId==='16').slice(0,3);
  const topProds=PRODUCTS.filter(p=>p.essential==='essential'||p.essential==='high-value').slice(0,4);
  const spotlight=['mens-vitality','sleep-recovery'];
  const rest=CATEGORIES.filter(c=>!spotlight.includes(c.id));
  const spot=CATEGORIES.filter(c=>spotlight.includes(c.id));
  let html=`
  <div class="grid gap-3" style="display:grid;grid-template-columns:1fr;">
    <section class="mb-6">
      <div class="flex items-center justify-between mb-3"><span class="section-label">Featured articles</span></div>
      <div style="display:grid;gap:10px">${featured.map(a=>articleCard(a)).join('')}</div>
    </section>
    <section class="mb-8">
      <div class="flex items-center justify-between mb-3"><span class="section-label">Top products</span><a href="#" onclick="setState({section:'products',category:'all',subTab:'all'});return false">View directory</a></div>
      <div style="display:grid;gap:10px">${topProds.map(p=>productCard(p)).join('')}</div>
    </section>
    <section class="mb-6">
      <span class="section-label">Start here</span>
      <div style="display:grid;gap:8px">${spot.map(c=>catCard(c)).join('')}</div>
    </section>
    <section class="mb-6">
      <span class="section-label">All categories</span>
      <div style="display:grid;gap:8px">${rest.map(c=>catCard(c)).join('')}</div>
    </section>
    <section>
      <div class="flex items-center justify-between mb-3"><span class="section-label">All articles (${all.length})</span></div>
      <div style="display:grid;gap:10px">${all.length?all.map(a=>articleCard(a)).join(''):'<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No articles</div><div class="empty-desc">No articles match your search or filters.</div></div>'}</div>
    </section>
  </div>`;
  return html;
}

// ── Category (tier 2 + tier 3) ───────────────────────────────
function renderCategory(){
  const cat=catById(state.category);
  if(!cat){
    return '<div class="empty"><div class="empty-icon">📄</div><div class="empty-title">Category not found</div><div class="empty-desc">Please choose a category from the tabs.</div></div>';
  }
  const arts=sortItems(filterItems(ARTICLES.filter(a=>a.categoryId===state.category)));
  const sub=activeSubTab();
  return `
  <div class="card mb-4" style="overflow:hidden" id="cat-${esc(cat.id)}">
    <div class="card-body" style="padding:18px 16px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div style="font-size:1.7rem">${cat.icon}</div><div><div class="card-title">${esc(cat.title)}</div><div class="card-desc">${esc(cat.subtitle)}</div></div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${cat.files.map(f=>`<span class="badge" style="border-color:var(--border);color:var(--muted);font-size:0.65rem">File ${esc(f)}</span>`).join('')}</div>
    </div>
  </div>
  ${sub?`<div class="sheet-label">${esc(sub.title)} — ${esc(sub.desc||'')}</div>`:''}
  ${arts.length?`<div style="display:grid;gap:10px">${arts.map(a=>articleCard(a)).join('')}</div>`:'<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No articles</div><div class="empty-desc">No articles match your filters.</div></div>'}`;
}

// ── Other sections ───────────────────────────────────────────
function renderProducts(){
  let items=sortItems(filterItems(PRODUCTS));
  return `
  <div class="card mb-4"><div class="card-body" style="padding:16px"><div class="card-title">Product Directory</div><div class="card-desc">Verified links, prices & cost-per-serving. ✅ = price checked live on 1 Nov 2026 from iHerb; everything else is a marketplace search link.</div></div></div>
  <div style="display:grid;gap:10px">${items.map(p=>productCard(p)).join('')||'<div class="empty"><div class="empty-icon">📦</div><div class="empty-title">No products</div><div class="empty-desc">No products match your filters.</div></div>'}</div>`;
}

function renderProductDetail(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p) return '<div class="empty"><div class="empty-icon">📦</div><div class="empty-title">Product not found</div></div>';
  const priceText=p.price!==null?`$${p.price.toFixed(2)}`:'Price varies';
  return `
  <a href="${esc(p.url)}" target="_blank" rel="noopener" style="display:inline-block;margin-bottom:16px" class="btn btn-primary">Open on ${esc(p.source)}</a>
  <div class="card mb-4"><div class="card-body" style="padding:18px 16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div><div class="card-title">${esc(p.name)}</div><div class="card-desc">${esc(p.brand)} · ${esc(p.category)}</div></div>
      <div style="font-size:1.5rem">${p.price!==null?'💰':'🔗'}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="badge ${p.priceVerified?'badge-verified':'badge-link'}">${p.priceVerified?'✅ Price verified':'Marketplace search link'}</span>${essentialBadge(p)}</div>
    <div class="price-row" style="margin-bottom:8px"><span class="price-big">${priceText}</span><span class="price-small">${esc(p.currency)}</span></div>
    ${p.perServing?`<div class="per-serving">${esc(p.perServing)}</div>`:''}
    <div class="divider"></div>
    <div style="margin-top:8px"><div class="sheet-label" style="margin-bottom:6px">Purpose</div><p style="font-size:0.9rem">${esc(p.purpose)}</p></div>
    <div class="sheet-label" style="margin-top:12px;margin-bottom:6px">How to use</div><p style="font-size:0.9rem">${esc(p.use)}</p>
    <div class="sheet-label" style="margin-top:12px;margin-bottom:6px">Evidence</div><span class="badge ${badgeFor(p.evidence).split(' ')[1]}">${esc(p.evidence)}</span>
    <div class="sheet-label" style="margin-top:12px;margin-bottom:6px">Risks</div><ul style="font-size:0.9rem;color:var(--muted);padding-left:18px;margin-top:4px">${p.risks.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    <div class="sheet-label" style="margin-top:12px;margin-bottom:6px">Contraindications</div><ul style="font-size:0.9rem;color:var(--muted);padding-left:18px;margin-top:4px">${p.contraindications.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <p style="margin-top:16px;font-size:0.75rem;color:var(--muted)">Price date: ${esc(p.priceDate)}. Prices change constantly — treat as cost ranking, not a quote.</p>
  </div></div>`;
}

function renderFoods(){
  const groups=[...new Set(FOODS.map(f=>f.group))];
  let html='<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px">';
  groups.forEach(g=>{
    html+=`<div class="chip ${state.activeFoodGroup===g?'active':''}" onclick="setState({activeFoodGroup:'${esc(g)}'})">${esc(g)}</div>`;
  });
  html+='</div>';
  const g=state.activeFoodGroup||groups[0];
  const items=FOODS.filter(f=>f.group===g);
  html+=items.map(f=>`
  <a href="https://fdc.nal.usda.gov/food-search?query=${esc(f.fdcId)}" target="_blank" rel="noopener" class="food" style="text-decoration:none;color:inherit">
    <div class="food-info"><div style="display:flex;align-items:baseline;gap:6px"><div class="food-name">${esc(f.name)}</div><div class="food-group">${esc(f.group)}</div></div><div class="food-stats"><div><b>${f.kcal}</b> kcal</div><div><b>${f.protein}g</b> P</div><div><b>${f.fibre}g</b> F</div><div><b>${f.water}%</b> W</div></div>${f.notes?`<div class="food-notes">${esc(f.notes)}</div>`:''}</div>
    <div class="food-side"><span class="badge ${f.satietyEvidence==='Direct RCT'?'badge-high':f.satietyEvidence==='Indirect'?'badge-mod':'badge-low'}">${esc(f.satietyEvidence)}</span><div class="food-cost">${esc(f.cost)}</div></div>
  </a>`).join('');
  return html;
}

function renderMeals(){
  const types=[...new Set(MEALS.map(m=>m.type))];
  let html='<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px">';
  types.forEach(t=>{
    html+=`<div class="chip ${state.activeMealType===t?'active':''}" onclick="setState({activeMealType:'${esc(t)}'})">${esc(t)}</div>`;
  });
  html+='</div>';
  const t=state.activeMealType||types[0];
  const items=MEALS.filter(m=>m.type===t);
  html+=items.map(m=>`
  <div class="card mb-3" style="overflow:hidden">
    <div class="meal-head"><span class="meal-type">${esc(m.type)}</span>${essentialBadge({essential:'high-value'})}</div>
    <div class="meal-title">${esc(m.title)}</div>
    <div class="meal-body"><div class="meal-meta"><span class="badge badge-high">${esc(m.protein)} P</span><span class="badge badge-mod">${esc(m.fibre)} F</span></div>${m.notes?`<div class="meal-notes">${esc(m.notes)}</div>`:''}<div class="ingredients">${m.ingredients.map(i=>`<span class="ing">${esc(i)}</span>`).join('')}</div></div>
  </div>`).join('');
  return html;
}

// ── Content router ───────────────────────────────────────────
function renderContent(){
  const c=$('#content');
  let html='';
  if(state.category!=='all'){
    html=renderCategory();
  }else if(state.q.trim()){
    html=renderSearch();
  }else{
    switch(state.section){
      case 'home': html=renderHome();break;
      case 'products': html=renderProducts();break;
      case 'foods': html=renderFoods();break;
      case 'meals': html=renderMeals();break;
      default: html=renderHome();break;
    }
  }
  c.innerHTML=html;
}

// ============ INIT ============
function init(){
  // Theme first so CSS variables exist before first paint of state-dependent UI.
  const toggle=$('#themeToggle');
  const dark=localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  if(dark){document.documentElement.classList.add('dark');toggle.textContent='☀️'}
  toggle.onclick=()=>{
    const isDark=document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme',isDark?'dark':'light');
    toggle.textContent=isDark?'☀️':'🌙';
  };

  renderCategoryTabs();
  renderSubTabs();
  renderSortTabs();
  renderFilterChips();
  renderContent();

  // Search
  const search=$('#search');
  const clear=$('#clearSearch');
  search.value=state.q||'';
  if(state.q) clear.className='clear-btn visible';
  search.addEventListener('input',(e)=>{setState({q:e.target.value});clear.className=e.target.value?'clear-btn visible':'clear-btn'});
  clear.addEventListener('click',()=>{search.value='';setState({q:''});clear.className='clear-btn'});

  // Filters sheet
  $('#filterBtn').onclick=openSheet;
  $('#sheetBackdrop').onclick=closeSheet;
  $('#sheetClose').onclick=closeSheet;
  $('#applyFilters').onclick=applyFilters;
  $('#resetFilters').onclick=resetFilters;

  // Article reader
  $('#readerClose').onclick=closeReader;
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){
      if($('#reader').classList.contains('open')) closeReader();
      else if($('#filterSheet').classList.contains('open')) closeSheet();
    }
  });

  // Bottom nav
  $$('.nav-item').forEach(el=>{
    el.onclick=(e)=>{e.preventDefault();setState({section:el.dataset.section,category:'all',subTab:'all'});window.scrollTo(0,0)};
  });
}

window.setState=setState;
window.openArticle=openArticle;
window.closeReader=closeReader;
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
